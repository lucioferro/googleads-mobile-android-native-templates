import java.util.Properties

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

def loadLocalProperties() {
    Properties props = new Properties()
    File propsFile = rootProject.file('local.properties')
    if (propsFile.canRead()) {
        propsFile.withInputStream { props.load(it) }
    }
    return props
}

def resolveCredential(Properties props, String key) {
    if (props.containsKey(key)) {
        return props.getProperty(key)
    }
    if (project.hasProperty(key)) {
        return project.property(key).toString()
    }
    String envKey = key.replace('.', '_')
    return System.getenv(key) ?: System.getenv(envKey) ?: ""
}

Properties publicationProps = loadLocalProperties()

ext.artifactGroup = project.findProperty('ARTIFACT_PACKAGE')?.toString() ?: 'com.google.android.ads'
ext.artifactName = project.findProperty('ARTIFACT_NAME')?.toString() ?: 'nativeTemplates'
ext.artifactVersion = project.findProperty('ARTIFACT_VERSION')?.toString() ?: '1.0.0'
ext.mavenUsername = resolveCredential(publicationProps, 'MAVEN_USERNAME')?.trim() ?: ''
ext.mavenPassword = resolveCredential(publicationProps, 'MAVEN_PASSWORD')?.trim() ?: ''
ext.mavenReadUrl = resolveCredential(publicationProps, 'MAVEN_READ_URL')?.trim() ?: ''
ext.mavenWriteUrl = resolveCredential(publicationProps, 'MAVEN_WRITE_URL')?.trim() ?: ''

group artifactGroup
version artifactVersion

logger.lifecycle("Publishing write URL: ${mavenWriteUrl ?: 'not configured'}")
if (mavenReadUrl) {
    logger.lifecycle("Additional read repository: ${mavenReadUrl}")
}

android {
    namespace 'com.google.android.ads.nativetemplates'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pgcfg'
            consumerProguardFiles 'proguard-rules.pgcfg'
        }
    }

    lintOptions {
        resourcePrefix 'gnt_'
    }
    
    // Configuração para publicação
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    publications {
        register('release', MavenPublication) {
            afterEvaluate {
                from components.release
            }

            groupId = artifactGroup
            artifactId = artifactName
            version = artifactVersion

            pom {
                name = artifactName
                description = 'Fork of Native Templates for Google Mobile Ads - Custom Build'
                packaging = 'aar'

                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
//
//                scm {
//                    connection = 'scm:git:https://github.com/lucioferro/googleads-mobile-android-native-templates.git'
//                    developerConnection = 'scm:git:ssh://github.com/lucioferro/googleads-mobile-android-native-templates.git'
//                    url = 'https://github.com/lucioferro/googleads-mobile-android-native-templates'
//                }
            }
        }
    }

    if (mavenWriteUrl) {
        repositories {
            maven {
                name = 'RemoteRelease'
                url = uri(mavenWriteUrl)
                credentials {
                    username = mavenUsername
                    password = mavenPassword
                }
            }
        }
    } else {
        logger.warn('Maven write URL not configured; skipping remote publication repository.')
    }
}

repositories {
    google()
    mavenCentral()
    if (mavenReadUrl) {
        maven {
            name = 'RemoteReadOnly'
            url = uri(mavenReadUrl)
            credentials {
                username = mavenUsername
                password = mavenPassword
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.errorprone:error_prone_annotations:2.42.0'
}
